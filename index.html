<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!--app-head-->
    <meta name="theme-color" content="#1b130e"/>
    <link rel="icon" href="/images/nana-sans-logo.png" type="image/png"/>
    <link rel="apple-touch-icon" sizes="180x180" href="/images/nana-sans-logo.png"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Manrope:wght@300..700&display=swap"/>
    <script>
      // Returning visitors have already seen the welcome doors this session:
      // hide them before first paint so they don't flash over the page.
      try {
        if (sessionStorage.getItem("nanaSansWelcomeSeen")) document.documentElement.classList.add("welcome-seen");
      } catch (e) {}
    </script>
    <style>.welcome-seen [data-welcome-doors]{display:none}</style>
    <noscript><style>.reveal{opacity:1!important;transform:none!important}[data-welcome-doors]{display:none}</style></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/react-app/main.tsx"></script>
  </body>
</html>
